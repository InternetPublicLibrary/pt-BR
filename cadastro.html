---
layout: info
title: Cadastro
lang: pt-BR
description: Crie sua conta IPL.
permalink: /pt-BR/cadastro/
---

<div class="min-h-[70vh] flex items-center justify-center py-12">
    <div class="w-full max-w-md px-4">
        <div class="bg-white rounded-xl shadow-lg border p-8">
            <div class="text-center mb-8">
                <span
                    class="bg-blue-600 text-white w-12 h-12 rounded-lg flex items-center justify-center mx-auto text-xl font-bold mb-4">IP</span>
                <h1 class="text-2xl font-bold text-gray-900">Criar Conta</h1>
                <p class="text-gray-600">Junte-se à comunidade IPL</p>
            </div>

            <form action="#" method="POST" class="space-y-5">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="text-sm text-gray-600">
                    <label class="flex items-start">
                        <input type="checkbox" class="mr-2 mt-1 rounded border-gray-300" required>
                        <span>Concordo com os <a href="/pt-BR/termos-uso/" class="text-blue-600 hover:underline">Termos
                                de Uso</a> e <a href="/pt-BR/politica-privacidade/"
                                class="text-blue-600 hover:underline">Política de Privacidade</a></span>
                    </label>
                </div>
                <button type="submit"
                    class="w-full py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">
                    Criar Conta
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600">
                Já tem uma conta? <a href="/pt-BR/login/" class="text-blue-600 hover:underline font-medium">Entrar</a>
            </div>
        </div>
    </div>
</div>
