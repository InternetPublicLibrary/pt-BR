<!-- Hero -->
<section class="bg-gradient-to-r from-teal-600 to-cyan-600 text-white py-12">
    <div class="container mx-auto px-4 text-center">
        <i class="fas fa-envelope text-5xl mb-4 opacity-80"></i>
        <h1 class="text-4xl font-bold mb-4">Contato</h1>
        <p class="text-xl text-teal-100">Adoraríamos ouvir você</p>
    </div>
</section>

<div class="container mx-auto px-4 py-12">
    <div class="max-w-4xl mx-auto">
        <!-- Contact Cards -->
        <div class="grid md:grid-cols-3 gap-6 mb-10">
            <a href="mailto:contact@ipl.org"
                class="bg-white rounded-xl shadow-sm border p-6 text-center hover:shadow-md transition-shadow">
                <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-envelope text-blue-600 text-xl"></i>
                </div>
                <h3 class="font-semibold text-gray-900">Email</h3>
                <p class="text-blue-600">contact@ipl.org</p>
            </a>

            <a href="https://github.com/InternetPublicLibrary"
                class="bg-white rounded-xl shadow-sm border p-6 text-center hover:shadow-md transition-shadow">
                <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center mx-auto mb-4">
                    <i class="fab fa-github text-purple-600 text-xl"></i>
                </div>
                <h3 class="font-semibold text-gray-900">GitHub</h3>
                <p class="text-blue-600">@InternetPublicLibrary</p>
            </a>

            <a href="https://github.com/InternetPublicLibrary/IPLibrary-website/discussions"
                class="bg-white rounded-xl shadow-sm border p-6 text-center hover:shadow-md transition-shadow">
                <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-comments text-green-600 text-xl"></i>
                </div>
                <h3 class="font-semibold text-gray-900">Discussões</h3>
                <p class="text-blue-600">Participe da conversa</p>
            </a>
        </div>

        <!-- Contact Form -->
        <div class="bg-white rounded-xl shadow-sm border p-8">
            <h2 class="text-xl font-bold text-gray-900 mb-6">Envie uma mensagem</h2>
            <form action="#" method="POST" class="space-y-5">
                <div class="grid md:grid-cols-2 gap-5">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                        <input type="text" id="name" name="name" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Assunto</label>
                    <select id="subject" name="subject"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option>Consulta Geral</option>
                        <option>Feedback</option>
                        <option>Reportar Bug</option>
                        <option>Parceria</option>
                    </select>
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Mensagem</label>
                    <textarea id="message" name="message" rows="5" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <button type="submit"
                    class="w-full py-3 bg-teal-600 text-white font-semibold rounded-lg hover:bg-teal-700 transition-colors">Enviar
                    Mensagem</button>
            </form>
        </div>
    </div>
</div>
